name: Generate M3U Playlists

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Direct Playlist
        run: |
          python - << 'EOF'
          import os

          # Permanent live channel handles that resolve cleanly without token timeouts
          CHANNELS = [
              {
                  "name": "Amrita News",
                  "url": "https://www.youtube.com/@AmritaNews/live"
              },
              {
                  "name": "Kerala Vision News 24x7",
                  "url": "https://www.youtube.com/@keralavisionnews24x7/live"
              },
              {
                  "name": "Kannur Vision News",
                  "url": "https://www.youtube.com/@KannurVisionOnlinenews/live"
              }
          ]

          master_lines = ["#EXTM3U"]
          for channel in CHANNELS:
              master_lines.append(f'#EXTINF:-1 tvg-name="{channel["name"]}" group-title="Malayalam News",{channel["name"]}')
              master_lines.append(channel["url"])

          with open("youtube.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(master_lines) + "\n")
          print("Master playlist updated with permanent live handles.")
          EOF

      - name: Commit and push updated playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube.m3u
          git commit -m "Update live channel handles [skip ci]" || exit 0
          git pull origin main --rebase
          git push origin main
