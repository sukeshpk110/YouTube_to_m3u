name: M3U generator

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Deno
        uses: denoland/setup-deno@v2
      - name: Install yt-dlp
        run: pip install -U yt-dlp
      - name: Run script
        run: |
          cd scripts
          python3 youtube_m3ugrabber.py > ../youtube.m3u
      - name: Commit and push changes
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add youtube.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Update M3U links"
          git push
