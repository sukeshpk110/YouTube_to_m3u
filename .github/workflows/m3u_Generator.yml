name: Generate M3U Playlists

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Proxy Playlist
        run: |
          python - << 'EOF'
          import os

          # Using an alternative, stable public Piped API instance endpoint
          PIPED_API_BASE = "https://pipedapi.syncpundit.io"

          CHANNELS = [
              {
                  "name": "Amrita News",
                  "id": "AmritaNews"
              },
              {
                  "name": "Kerala Vision News 24x7",
                  "id": "keralavisionnews24x7"
              },
              {
                  "name": "Kannur Vision News",
                  "id": "KannurVisionOnlinenews"
              }
          ]

          master_lines = ["#EXTM3U"]
          for channel in CHANNELS:
              master_lines.append(f'#EXTINF:-1 tvg-name="{channel["name"]}" group-title="Malayalam News",{channel["name"]}')
              master_lines.append(f"{PIPED_API_BASE}/streams/{channel['id']}")

          with open("youtube.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(master_lines) + "\n")
          print("Master playlist updated with alternative proxy endpoints.")
          EOF

      - name: Commit and push updated playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube.m3u
          git commit -m "Update proxy to alternative instance [skip ci]" || exit 0
          git pull origin main --rebase
          git push origin main
