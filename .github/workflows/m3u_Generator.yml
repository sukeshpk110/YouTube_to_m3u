name: Generate M3U Playlists

on:
  schedule:
    - cron: '0 * * * *' # Runs hourly to keep tokens fresh
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp

      - name: Generate Playlists Inline
        run: |
          python - << 'EOF'
          import subprocess
          import os

          CHANNELS = [
              {
                  "id": "amrita_news",
                  "name": "Amrita News",
                  "url": "https://www.youtube.com/@AmritaNews/live"
              },
              {
                  "id": "kerala_vision",
                  "name": "Kerala Vision News 24x7",
                  "url": "https://www.youtube.com/@keralavisionnews24x7/live"
              },
              {
                  "id": "kannur_vision",
                  "name": "Kannur Vision News",
                  "url": "https://www.youtube.com/@KannurVisionOnlinenews/live"
              }
          ]

          OUTPUT_DIR = "channels"
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          def fetch_stream_url(channel):
              print(f"[{channel['name']}] Extracting live stream URL...")
              cmd = [
                  "yt-dlp", "-g",
                  "--extractor-args", "youtube:player_client=android,web",
                  "-f", "best",
                  channel["url"]
              ]
              try:
                  result = subprocess.run(cmd, capture_output=True, text=True, check=True)
                  urls = result.stdout.strip().splitlines()
                  return urls[0] if urls else None
              except Exception as e:
                  print(f"[{channel['name']}] Error: {e}")
                  return None

          def generate_master_playlist():
              master_lines = ["#EXTM3U"]
              for channel in CHANNELS:
                  stream_url = fetch_stream_url(channel)
                  if stream_url:
                      master_lines.append(f'#EXTINF:-1 tvg-name="{channel["name"]}" group-title="Malayalam News",{channel["name"]}')
                      master_lines.append(stream_url)
                      
              with open("youtube.m3u", "w", encoding="utf-8") as f:
                  f.write("\n".join(master_lines) + "\n")
              print("Master playlist updated with fresh direct stream tokens!")

          if __name__ == "__main__":
              generate_master_playlist()
          EOF

      - name: Commit and push updated playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube.m3u
          git commit -m "Auto-update fresh direct YouTube tokens [skip ci]" || exit 0
          git pull origin main --rebase
          git push origin main
