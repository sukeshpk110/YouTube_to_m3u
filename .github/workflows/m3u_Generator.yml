name: Generate M3U Playlists

on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours automatically
  workflow_dispatch:      # Allows manual trigger from GitHub website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Deno (Required for YouTube challenge solver)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run M3U Generator Script
        run: |
          python youtube_m3ugrabber.py

      - name: Commit and push updated playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/ youtube.m3u
          git commit -m "Auto-update YouTube live streams [skip ci]" || exit 0
          git push
