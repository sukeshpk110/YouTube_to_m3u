name: M3U Generator

on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours
  workflow_dispatch:      # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip yt-dlp

      - name: Run M3U Grabber Script
        run: python scripts/youtube_m3ugrabber.py

      - name: Commit and push generated playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/ youtube.m3u
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update IPTV playlists" && git push)
