name: M3U Generator

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours automatically
  workflow_dispatch:  # Adds the manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests

      - name: Create cookies.txt from Secret
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Run M3U generator script
        run: |
          chmod +x autorun.sh
          ./autorun.sh

      - name: Commit and push updated M3U
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          git add youtube.m3u
          git commit -m "Auto-update YouTube M3U playlist [skip ci]" || exit 0
          git push
