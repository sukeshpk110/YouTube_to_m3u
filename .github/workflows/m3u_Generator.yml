name: M3U generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run M3U generator script
        run: python scripts/youtube_m3ugrabber.py

      - name: Commit and push updated M3U files
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add channels/
          git commit -m "Update M3U links via yt-dlp" || echo "No changes to commit"
          git push
