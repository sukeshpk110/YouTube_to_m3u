name: M3U generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno
        uses: denoland/setup-deno@v2

      - name: Install yt-dlp with JS challenge support
        run: pip install --upgrade "yt-dlp[default]"

      - name: Write cookies from secret
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
          fi

      - name: Run M3U grabber
        run: python scripts/youtube_m3ugrabber.py

      - name: Remove temporary cookies file
        if: always()
        run: rm -f cookies.txt

      - name: Commit and push updated playlists
        run: |
          git config --global user.name 'actions-user'
          git config --global user.email 'actions@github.com'
          git add channels/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update M3U links" && git push)
