name: M3U Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp

      - name: Create cookies.txt from Secret
        run: |
          printf '%s\n' "${{ secrets.YOUTUBE_COOKIES }}" | tr -d '\r' > cookies.txt

      - name: Run M3U generator script
        run: |
          chmod +x autorun.sh
          ./autorun.sh

      - name: Commit and push updated M3U
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube.m3u channels/
          git commit -m "Auto-update YouTube M3U playlist" || exit 0
          git push
